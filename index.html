<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <section id="team">
            <h1 class="section-title"> Meet Our team</h1>
            <p class="section-description">
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Inventore consectetur fugiat, magnam, quae
                soluta necessitatibus recusandae tempora ut consequatur nam doloribus velit optio odit maxime
                perferendis totam nisi beatae vitae.
            </p>
            <div class="team-container">
            </div>
        </section>
        <section class="form-container">
            <h2>Add Team Member</h2>
            <form id="member-form">
                <div>
                    <input type="text" id="name" placeholder="Nome Completo" required>

                </div>
                <div>
                    <input type="text" id="role" placeholder="Ruolo" required>

                </div>
                <div>
                    <input type="text" id="email" placeholder="E-mail" required>

                </div>
                <div>
                    <input type="text" id="image" placeholder="Url dell'immagine" required>

                </div>
                <button type="submit">Aggiungi membro</button>
            </form>
        </section>
    </div>
    <script src="main.js"></script>
</body>

</html>
